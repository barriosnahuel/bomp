apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.firebase.firebase-perf'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: "$project.rootProject.projectDir/linters.gradle"

android {
    namespace = 'com.github.barriosnahuel.vossosunboton'

    compileSdkVersion "android-37.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        applicationId "com.github.barriosnahuel.vossosunboton"
        minSdkVersion 23
        targetSdkVersion 37
        versionCode 8
        versionName '2.3.0' // last SemVer release; CalVer from the next cut (CONTRIBUTING § Versioning)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Keep capture/utility drivers out of the default suite (connectedDebugAndroidTest /
        // run-instrumented-tests.sh). The store-screenshot driver still runs via
        // capture-store-screenshots.sh, which targets it with `am instrument -e class …` and so
        // doesn't inherit these Gradle-passed runner arguments.
        testInstrumentationRunnerArguments notAnnotation: 'com.github.barriosnahuel.vossosunboton.ScreenshotCapture'
    }

    androidResources {
        localeFilters += ["en", "es"]
    }

    sourceSets {
        androidTest.assets.srcDirs += 'src/androidTest/assets'
        // The benchmark build type runs under the debug applicationId (`.debug`), so it should look
        // like the debug app — reuse the debug grey launcher icon. The production green icon on a
        // throwaway benchmark build is misleading.
        benchmark.res.srcDirs += 'src/debug/res'
    }

    resourcePrefix = 'app_'

    signingConfigs {
        release {

            File keystoreFile = file("$project.rootProject.projectDir/nahuelbarrios.keystore-appbundle.pkcs12")
            File propertiesFile = file("$project.rootProject.projectDir/secure.properties")
            if (keystoreFile.exists() && propertiesFile.exists()) {
                logger.warn('WARNING: Release keystore is available for app signing')
                Properties properties = new Properties()
                properties.load(new FileInputStream(propertiesFile))

                keyAlias properties.getProperty('key.alias')
                keyPassword properties.getProperty('key.password')
                storeFile keystoreFile
                storePassword properties.getProperty('store.password')
            } else {
                keyAlias "androiddebugkey"
                keyPassword "android"
                storeFile file("$project.rootProject.projectDir/debug_keystore.keystore")
                storePassword "android"
            }
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true

            all {
                testLogging {
                    events 'PASSED', 'FAILED'
                }
            }
        }
    }

    buildTypes {
        debug {
            // Comment this suffix to use a debug build at Internal App Sharing: https://play.google.com/apps/publish/internalappsharing/
            applicationIdSuffix ".debug"
            versionNameSuffix "-DEBUG ${new Date().format("YYYY-MM-dd HH:mm:ss")}"
            buildConfigField "String", "DEBUG_ROOT_DIR_NAME", "\"${rootProject.projectDir.name}\""
        }

        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
            buildConfigField "String", "DEBUG_ROOT_DIR_NAME", "\"\""
            ndk {
                debugSymbolLevel 'FULL'
            }
        }

        // Release-like build target consumed only by the :macrobenchmark module (non-debuggable +
        // minified so startup/frame numbers match what users get). Made profileable via
        // src/benchmark/AndroidManifest.xml.
        benchmark {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            // Reuse the debug app identity (`.debug`) + debug signing: the benchmark then installs
            // over the dev debug app (same key, an update — not a signature clash) and resolves the
            // real debug Firebase config (bomp-debug, valid key → no FirebaseSessions fatal; its
            // init is also measured representatively). google-services for this build type is the
            // debug one, swapped in by scripts/setup-worktree.sh (skip-worktree).
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            // Don't upload the R8 mapping to Firebase (minified benchmark would 400 on the dummy).
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }

        // Non-minified release, used ONLY to generate the Baseline Profile (scripts/generate-baseline-
        // profile.sh). Runs the real release code — its own CustomBuildTypeApplication in
        // src/nonMinifiedRelease mirrors src/release (source sets resolve by build-type name, not
        // initWith, so it can't share the release one) — but un-minified, so the collected rules carry
        // real names that AGP remaps through R8 when it bakes the profile into the minified release.
        // Same `.debug` identity as benchmark (debug Firebase config, debug signing, installs over the
        // dev debug app). Profileable via src/nonMinifiedRelease/AndroidManifest.xml.
        nonMinifiedRelease {
            initWith release
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled false
            shrinkResources false
            applicationIdSuffix ".debug"
            signingConfig signingConfigs.debug
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }

    buildFeatures {
        buildConfig = true
        compose = true
    }

}

dependencies {
    implementation project(':commons_file')
    implementation project(':commons_android')
    implementation project(':model')

    implementation libs.androidx.appcompat
    implementation libs.androidx.annotation
    implementation libs.material

    implementation platform(libs.firebase.bom)
    implementation libs.firebase.analytics
    implementation libs.firebase.perf

    implementation libs.timber

    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.androidx.activity.compose
    implementation libs.androidx.core.splashscreen
    implementation libs.androidx.tracing
    implementation libs.androidx.media3.exoplayer
    implementation libs.androidx.media3.inspector
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose
    implementation libs.coroutines.android
    implementation libs.coroutines.core
    implementation libs.androidx.datastore.preferences
    implementation libs.androidx.biometric

    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest
    debugImplementation libs.androidx.metrics.performance

    testImplementation libs.junit
    testImplementation libs.androidx.test.core
    testImplementation libs.robolectric
    testImplementation libs.truth
    testImplementation libs.mockk
    testImplementation libs.coroutines.test
    testImplementation platform(libs.compose.bom)
    testImplementation libs.compose.ui.test.junit4
    testImplementation testFixtures(project(':commons_android'))

    androidTestImplementation platform(libs.compose.bom)
    androidTestImplementation libs.compose.ui.test.junit4
    androidTestImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.espresso.intents
    androidTestImplementation(libs.espresso.accessibility) {
        // Old protobuf-lite (3.0.1) is missing methods that Firebase Perf's
        // protobuf-javalite calls — when both end up in the test APK the app
        // crashes at startup with NoSuchMethodError. Drop the old transitive
        // dep and let Firebase's modern protobuf take over.
        exclude group: 'com.google.protobuf', module: 'protobuf-lite'
    }
    androidTestImplementation libs.androidx.uiautomator
    androidTestImplementation libs.truth
    androidTestImplementation libs.mockk
    androidTestImplementation testFixtures(project(':commons_android'))
}
