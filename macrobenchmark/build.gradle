apply plugin: 'com.android.test'
apply from: "$project.rootProject.projectDir/linters.gradle"

android {
    namespace = 'com.github.barriosnahuel.vossosunboton.macrobenchmark'

    compileSdkVersion "android-37.0"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        // minSdk 28: Macrobenchmark needs a profileable/debuggable target and is most reliable on
        // API 28+. The app itself stays at minSdk 23; this only constrains where benchmarks run.
        minSdkVersion 28
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        // Matches the app's `benchmark` build type. Debuggable so the test harness (not the app
        // under test) installs and runs; signed with the debug key for local/CI use.
        benchmark {
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    // Gradle Managed Devices: reproducible emulators declared in-repo (ADR 0015), so the jank
    // matrix and the Fase-5 fix re-validation run the same devices everywhere. `google` source
    // brings GMS, so MainApplication's Firebase/Play init is measured as on a real device (`aosp`
    // would under-measure startup). GMD auto-downloads the system images. Numbers are directional —
    // emulators run on the host CPU; run benchmarks with `androidx.benchmark.suppressErrors=EMULATOR`.
    // The authoritative low-tier numbers come from a physical device.
    testOptions {
        managedDevices {
            localDevices {
                api34pixel6 {
                    device = "Pixel 6"
                    apiLevel = 34
                    systemImageSource = "google"
                }
                api30pixel4 {
                    device = "Pixel 4"
                    apiLevel = 30
                    systemImageSource = "google"
                }
                api33pixel4a {
                    device = "Pixel 4a"
                    apiLevel = 33
                    systemImageSource = "google"
                }
            }
        }
    }

    targetProjectPath = ':app'
    experimentalProperties["android.experimental.self-instrumenting"] = true
}

// Only build the `benchmark` variant; skip the default `debug` variant (it would target the app's
// debuggable build and produce meaningless numbers).
androidComponents {
    beforeVariants(selector().all()) { variant ->
        variant.enable = variant.buildType == 'benchmark'
    }
}

dependencies {
    implementation libs.androidx.test.ext.junit
    implementation libs.androidx.uiautomator
    implementation libs.androidx.benchmark.macro.junit4
}
