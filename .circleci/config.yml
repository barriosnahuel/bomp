# .circleci/config.yaml
version: 2.1
orbs:
  android: circleci/android@3.2.0
  # https://circleci.com/developer/orbs/orb/circleci/android for latest version
jobs:
  "compile":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - run:
          name: "Compile Debug and Release Sources"
          command: ./gradlew compileDebugSources compileReleaseSources
      - android/save_gradle_cache
      - persist_to_workspace:
          root: .
          paths:
            - "*/build"
            - ".gradle"

  "detekt":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Detekt"
          command: ./gradlew detekt
      - store_artifacts:
          path: "app/build/reports/detekt/detekt.html"

  "ktlint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run ktlint"
          command: ./gradlew ktlintCheck

  "spotless":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Spotless (license headers)"
          command: ./gradlew spotlessCheck

  "lint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Android Lint"
          command: ./gradlew :app:lintDebug :app:lintRelease
      - store_artifacts:
          path: "app/build/reports/lint-results-debug.html"
      - store_artifacts:
          path: "app/build/reports/lint-results-release.html"

  "test":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Unit Tests"
          command: ./gradlew test
      - store_artifacts:
          path: "app/build/reports/tests/"

  "adr-invariants":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify ADR invariants are not violated"
          command: ./scripts/check-adr-invariants.sh

  "security-test-count-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify security-test count matches EXPECTED_COUNT"
          command: ./scripts/check-security-test-count.sh

  "analytics-wrapper-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify nothing bypasses the AnalyticsTracker wrapper"
          command: ./scripts/check-analytics-wrapper.sh

  "test-assertion-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify no bare kotlin.assert(...) in test sources"
          command: ./scripts/check-test-assertions.sh

  "outliving-work-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify JVM tests neutralise the work their hosts start"
          command: ./scripts/check-outliving-work.sh

  "worktree-cleanup-test":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Behaviour test for scripts/cleanup-merged-worktrees.sh"
          command: ./scripts/test-cleanup-merged-worktrees.sh

  # The instrumented suite itself is not run in CI (ADR 0001) — but the watchdog that
  # decides when to kill it is pure bash over stubbed adb/emulator/gradlew, so it is,
  # and it must be: a watchdog bug kills healthy runs and reads as a flaky suite.
  "instrumented-watchdog-test":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Behaviour test for the stall watchdog in scripts/run-instrumented-tests.sh"
          command: ./scripts/test-run-instrumented-tests.sh

  # Same reasoning as instrumented-watchdog-test: the suite itself can't run in CI,
  # but the bookkeeping that decides "known flaky vs. new regression" is pure bash
  # over fabricated history — and a wrong verdict there is expensive in both
  # directions (ship a bug, or debug a test that was already lying).
  "flaky-report-test":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Behaviour test for the instrumented run history + flaky report"
          command: ./scripts/test-flaky-report.sh

  "bundle":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Bundle Release"
          command: ./gradlew app:bundleRelease -x lintVitalRelease -x uploadCrashlyticsMappingFileRelease

workflows:
  version: 2.1
  "Pull Requests Workflow":
    jobs:
      - compile
      # Cheap linters gate everything heavy — fail fast on style/format issues.
      - detekt:
          requires:
            - compile
      - ktlint:
          requires:
            - compile
      - spotless:
          requires:
            - compile
      # Heavy lint runs in parallel with test/bundle — they don't gate each other.
      - lint:
          requires:
            - compile
      - test:
          requires:
            - detekt
            - ktlint
            - spotless
      - analytics-wrapper-guard
      - test-assertion-guard
      - adr-invariants
      - security-test-count-guard
      - worktree-cleanup-test
      - instrumented-watchdog-test
      - flaky-report-test
      - outliving-work-guard
      - bundle:
          requires:
            - detekt
            - ktlint
            - spotless
            - analytics-wrapper-guard
            - test-assertion-guard
            - outliving-work-guard
            - adr-invariants
            - security-test-count-guard
            - worktree-cleanup-test
