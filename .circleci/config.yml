# .circleci/config.yaml
version: 2.1
orbs:
  android: circleci/android@3.2.0
  # https://circleci.com/developer/orbs/orb/circleci/android for latest version
jobs:
  "test":
    executor:
      name: android/android-docker
      tag: 2026.03
    steps:
      - checkout
      - run:
          name: "Run Tests"
          command: ./gradlew test
      - store_artifacts:
          path: "app/build/reports/tests/"
  "code-analysis":
    executor:
      name: android/android-docker
      tag: 2026.03
    steps:
      - checkout
      - run:
          name: "Run Code Analyzers"
          command: ./gradlew check -x test
      - run:
          name: "Run Release Lint"
          command: ./gradlew app:lintRelease
      - store_artifacts:
          path: "app/build/reports/lint-results-debug.html"
      - store_artifacts:
          path: "app/build/reports/lint-results-release.html"
      - store_artifacts:
          path: "app/build/reports/detekt/detekt.html"
  "build":
    executor:
      name: android/android-docker
      tag: 2026.03
    steps:
      - checkout
      - run:
          name: "Run App Build"
          command: ./gradlew app:build -x check -x lintVitalRelease -x uploadCrashlyticsMappingFileRelease
      - run:
          name: "Run App Bundle"
          command: ./gradlew app:bundle -x uploadCrashlyticsMappingFileRelease
workflows:
  version: 2.1
  "Pull Requests Workflow":
    jobs:
      - test
      - code-analysis
      - build