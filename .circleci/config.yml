# .circleci/config.yaml
version: 2.1
orbs:
  android: circleci/android@3.2.0
  # https://circleci.com/developer/orbs/orb/circleci/android for latest version
jobs:
  "compile":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - run:
          name: "Compile Debug and Release Sources"
          command: ./gradlew compileDebugSources compileReleaseSources
      - android/save_gradle_cache
      - persist_to_workspace:
          root: .
          paths:
            - "*/build"
            - ".gradle"

  "detekt":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Detekt"
          command: ./gradlew detekt
      - store_artifacts:
          path: "app/build/reports/detekt/detekt.html"

  "ktlint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run ktlint"
          command: ./gradlew ktlintCheck

  "spotless":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Spotless (license headers)"
          command: ./gradlew spotlessCheck

  "lint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Android Lint"
          command: ./gradlew lint app:lintRelease app:lintVitalRelease
      - store_artifacts:
          path: "app/build/reports/lint-results-debug.html"
      - store_artifacts:
          path: "app/build/reports/lint-results-release.html"

  "test":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Tests"
          command: ./gradlew test
      - store_artifacts:
          path: "app/build/reports/tests/"

  "analytics-wrapper-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify no direct FirebaseAnalytics.logEvent calls bypass the wrapper"
          command: |
            if grep -rnE 'FirebaseAnalytics\.[a-zA-Z]+\.logEvent' \
                --include='*.kt' --include='*.java' \
                --exclude='FirebaseAnalyticsTracker.kt' \
                app/ commons_android/ commons_file/ model/; then
                echo "ERROR: Direct FirebaseAnalytics.logEvent call detected. Use the AnalyticsTracker wrapper at commons_android/.../analytics/."
                exit 1
            fi

  "bundle":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Bundle Debug and Release"
          command: ./gradlew app:bundleDebug app:bundleRelease -x lintVitalRelease -x uploadCrashlyticsMappingFileRelease

workflows:
  version: 2.1
  "Pull Requests Workflow":
    jobs:
      - compile
      - detekt:
          requires:
            - compile
      - ktlint:
          requires:
            - compile
      - spotless:
          requires:
            - compile
      - lint:
          requires:
            - compile
      - test:
          requires:
            - detekt
            - ktlint
            - spotless
            - lint
      - analytics-wrapper-guard
      - bundle:
          requires:
            - test
            - analytics-wrapper-guard
