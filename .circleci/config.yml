# .circleci/config.yaml
version: 2.1
orbs:
  android: circleci/android@3.2.0
  # https://circleci.com/developer/orbs/orb/circleci/android for latest version
jobs:
  "compile":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - run:
          name: "Compile Debug and Release Sources"
          command: ./gradlew compileDebugSources compileReleaseSources
      - android/save_gradle_cache
      - persist_to_workspace:
          root: .
          paths:
            - "*/build"
            - ".gradle"

  "detekt":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Detekt"
          command: ./gradlew detekt
      - store_artifacts:
          path: "app/build/reports/detekt/detekt.html"

  "ktlint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run ktlint"
          command: ./gradlew ktlintCheck

  "spotless":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Spotless (license headers)"
          command: ./gradlew spotlessCheck

  "lint":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Android Lint"
          command: ./gradlew :app:lintDebug :app:lintRelease
      - store_artifacts:
          path: "app/build/reports/lint-results-debug.html"
      - store_artifacts:
          path: "app/build/reports/lint-results-release.html"

  "test":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Run Unit Tests"
          command: ./gradlew test
      - store_artifacts:
          path: "app/build/reports/tests/"

  "adr-invariants":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify ADR invariants are not violated"
          command: ./scripts/check-adr-invariants.sh

  "security-test-count-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify security-test count matches EXPECTED_COUNT"
          command: ./scripts/check-security-test-count.sh

  "analytics-wrapper-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify nothing bypasses the AnalyticsTracker wrapper"
          command: |
            # Production sourcesets only — tests legitimately mock FirebaseAnalytics inside the wrapper's own tests.
            MAIN_DIRS="app/src/main commons_android/src/main commons_file/src/main model/src/main"
            # Any FirebaseAnalytics.getInstance(...) call must originate inside the wrapper provider.
            if grep -rnE 'FirebaseAnalytics\s*\.\s*getInstance' \
                --include='*.kt' --include='*.java' \
                --exclude='AnalyticsTrackerProvider.kt' \
                --exclude='FirebaseAnalyticsTracker.kt' \
                $MAIN_DIRS; then
                echo "ERROR: Direct FirebaseAnalytics.getInstance(...) call detected outside the wrapper. Use AnalyticsTrackerProvider.get(context)."
                exit 1
            fi
            # And only FirebaseAnalyticsTracker.kt is allowed to call .logEvent(.
            if grep -rnE '\.logEvent\s*\(' \
                --include='*.kt' --include='*.java' \
                --exclude='FirebaseAnalyticsTracker.kt' \
                $MAIN_DIRS; then
                echo "ERROR: Direct .logEvent(...) call detected outside FirebaseAnalyticsTracker.kt. Add an AnalyticsEvent subclass and call tracker.log(...) instead."
                exit 1
            fi

  "test-assertion-guard":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Verify no bare kotlin.assert(...) in test sources"
          command: |
            # `kotlin.assert(cond) { msg }` is a no-op without JVM `-ea` — see CLAUDE.md § Test assertions.
            # Tests must use Truth (`assertThat`), JUnit (`assertEquals` etc.), or the Compose UI Test API.
            TEST_DIRS="app/src/test app/src/androidTest commons_android/src/test commons_file/src/test model/src/test"
            if grep -rnE '(^|[^[:alnum:]_])assert[[:space:]]*\(' \
                --include='*.kt' \
                $TEST_DIRS; then
                echo "ERROR: Bare assert(...) detected in test sources. kotlin.assert is a no-op without JVM -ea — use assertThat(...) (Truth), assertEquals(...) (JUnit), or assertCountEquals(...) (Compose UI Test). See CLAUDE.md § Test assertions."
                exit 1
            fi

  "worktree-cleanup-test":
    executor:
      name: android/android_docker
      tag: "2026.03"
    steps:
      - checkout
      - run:
          name: "Behaviour test for scripts/cleanup-merged-worktrees.sh"
          command: ./scripts/test-cleanup-merged-worktrees.sh

  "bundle":
    executor:
      name: android/android_docker
      tag: "2026.03"
      resource_class: medium+
    steps:
      - checkout
      - android/restore_gradle_cache
      - attach_workspace:
          at: .
      - run:
          name: "Bundle Release"
          command: ./gradlew app:bundleRelease -x lintVitalRelease -x uploadCrashlyticsMappingFileRelease

workflows:
  version: 2.1
  "Pull Requests Workflow":
    jobs:
      - compile
      # Cheap linters gate everything heavy — fail fast on style/format issues.
      - detekt:
          requires:
            - compile
      - ktlint:
          requires:
            - compile
      - spotless:
          requires:
            - compile
      # Heavy lint runs in parallel with test/bundle — they don't gate each other.
      - lint:
          requires:
            - compile
      - test:
          requires:
            - detekt
            - ktlint
            - spotless
      - analytics-wrapper-guard
      - test-assertion-guard
      - adr-invariants
      - security-test-count-guard
      - worktree-cleanup-test
      - bundle:
          requires:
            - detekt
            - ktlint
            - spotless
            - analytics-wrapper-guard
            - test-assertion-guard
            - adr-invariants
            - security-test-count-guard
            - worktree-cleanup-test
