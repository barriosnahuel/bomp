<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!--
    Feature graphic for Google Play — Bomp en-US.
    Composition matches store-listing/en-US/briefs/feature-graphic.md.
    No wordmark by design: the app name already appears in the icon and in the
    listing's `title`; repeating it here is noise. Only mark + tagline.
    Open in Inkscape to fine-tune the typography, then export to PNG 1024x500.
    Colors are hardcoded for the same reason as bomp-mark.svg.
  -->

  <!-- Background: full-bleed Ink1000 -->
  <rect x="0" y="0" width="1024" height="500" fill="#0B0B0C"/>

  <!-- Sound waves emanating from the mark — three concentric blobs at decreasing opacity.
       Center of mark area ~ (256, 250). Path is the bomp-mark organic blob, scaled and translated. -->
  <g transform="translate(96 90)" fill="#D7FF3A">
    <!-- Outermost wave: 8% opacity, scale 1.5 -->
    <g transform="translate(-80 -80) scale(1.5)" opacity="0.08">
      <path d="M10.24 0 A21.76 9.6 0 0 1 32 9.6 A22.4 22.4 0 0 1 9.6 32 A9.6 22.4 0 0 1 0 9.6 A10.24 9.6 0 0 1 10.24 0 Z" transform="scale(10)"/>
    </g>
    <!-- Middle wave: 15% opacity, scale 1.25 -->
    <g transform="translate(-40 -40) scale(1.25)" opacity="0.15">
      <path d="M10.24 0 A21.76 9.6 0 0 1 32 9.6 A22.4 22.4 0 0 1 9.6 32 A9.6 22.4 0 0 1 0 9.6 A10.24 9.6 0 0 1 10.24 0 Z" transform="scale(10)"/>
    </g>
    <!-- Inner wave: 30% opacity, scale 1.1 -->
    <g transform="translate(-16 -16) scale(1.1)" opacity="0.30">
      <path d="M10.24 0 A21.76 9.6 0 0 1 32 9.6 A22.4 22.4 0 0 1 9.6 32 A9.6 22.4 0 0 1 0 9.6 A10.24 9.6 0 0 1 10.24 0 Z" transform="scale(10)"/>
    </g>
    <!-- The mark itself, full Acid400 + Ink1000 play triangle -->
    <g>
      <path d="M10.24 0 A21.76 9.6 0 0 1 32 9.6 A22.4 22.4 0 0 1 9.6 32 A9.6 22.4 0 0 1 0 9.6 A10.24 9.6 0 0 1 10.24 0 Z" fill="#D7FF3A" transform="scale(10)"/>
      <path d="M10 8 L10 24 L23 16 Z" fill="#0B0B0C" transform="scale(10)"/>
    </g>
  </g>

  <!-- Tagline: two lines, SemiBold 64, Paper. Anchored at x=460 (just past the outer wave halo)
       so the visual flow reads mark → halo → tagline. Vertically centered around y=250. -->
  <g fill="#FAFAF7" font-family="Inter, Roboto, system-ui, sans-serif" font-weight="600">
    <text x="460" y="225" font-size="64">Voices</text>
    <text x="460" y="305" font-size="64">that matter.</text>
  </g>
</svg>
